<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#100a07">
    <meta name="description" content="Bear Visuals — визуальный мод для Minecraft.">
    <title>Bear Visuals — Visuals. Your Style.</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
        :root {
            --bg: #100a07;
            --bg-light: #160d09;
            --panel: #1c110c;
            --panel-light: #24160f;
            --brown: #8b5a2b;
            --accent: #b8793e;
            --gold: #d29a61;
            --text: #fff4e8;
            --muted: #b8a99d;
            --soft: #77685d;
            --border: rgba(210, 154, 97, 0.18);
            --green: #9ed7aa;
            --red: #ff9288;
            --radius: 16px;
            --max-width: 1160px;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background:
                radial-gradient(
                    ellipse at 50% 0%,
                    rgba(139, 90, 43, 0.16),
                    transparent 42%
                ),
                var(--bg);
            color: var(--text);
            font-family: Manrope, "Segoe UI", Arial, sans-serif;
            line-height: 1.55;
        }

        body.modal-open {
            overflow: hidden;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button,
        input {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.55;
            cursor: wait;
        }

        [hidden] {
            display: none !important;
        }

        .wrap {
            width: min(var(--max-width), calc(100% - 40px));
            margin: auto;
        }

        /* HEADER */

        .nav {
            min-height: 78px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 22px;
            border-bottom: 1px solid rgba(210, 154, 97, 0.09);
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 11px;
            font-weight: 800;
            font-size: 17px;
            letter-spacing: -0.4px;
        }

        .brand-mark {
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            flex-shrink: 0;
            border-radius: 12px;
            border: 1px solid rgba(210, 154, 97, 0.42);
            background: linear-gradient(145deg, #57351f, #24160f);
            box-shadow: 0 0 24px rgba(184, 121, 62, 0.12);
            color: var(--gold);
            font-size: 22px;
        }

        .brand small {
            display: block;
            color: var(--soft);
            font-size: 9px;
            letter-spacing: 2px;
            font-weight: 700;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 25px;
            color: #c1b0a3;
            font-size: 12px;
            font-weight: 700;
        }

        .nav-links a:hover,
        .footer-links a:hover {
            color: var(--gold);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            min-height: 43px;
            padding: 0 17px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.025);
            color: var(--text);
            font-size: 12px;
            font-weight: 800;
            transition: transform 0.18s, border-color 0.18s;
        }

        .btn:hover {
            transform: translateY(-1px);
            border-color: rgba(210, 154, 97, 0.5);
        }

        .btn-primary {
            background: linear-gradient(135deg, #b8793e, #8b5a2b);
            border-color: rgba(255, 221, 181, 0.12);
            box-shadow: 0 7px 26px rgba(139, 90, 43, 0.16);
        }

        .btn-primary:hover {
            filter: brightness(1.1);
        }

            padding: 82px 0 70px;
